# Change this hostname to the same DNS name used by gateway.yml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: devboard-https-redirect
  namespace: devboard
spec:
  parentRefs:
    - name: devboard-gateway
      sectionName: http
  hostnames:
    - devboard.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
