# Change this DNS name before applying.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: devboard-tls
  namespace: devboard
spec:
  secretName: devboard-tls
  dnsNames:
    - devboard.example.com
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  renewBefore: 720h
