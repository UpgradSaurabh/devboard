apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: devboard-gateway
  namespace: devboard
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    # Change this hostname to the same DNS name used by certificate.yml.
    - name: https
      protocol: HTTPS
      port: 443
      hostname: devboard.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: devboard-tls
      allowedRoutes:
        namespaces:
          from: Same
