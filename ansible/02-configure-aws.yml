---
- name: Configure AWS and shell
  hosts: devboard
  become: true

  tasks:
    - name: Create AWS config directory
      ansible.builtin.file:
        path: "/home/{{ login_user }}/.aws"
        state: directory
        owner: "{{ login_user }}"
        group: "{{ login_user }}"
        mode: "0700"

    - name: Configure AWS region
      ansible.builtin.copy:
        content: |
          [default]
          region = {{ aws_region }}
          output = json
        dest: "/home/{{ login_user }}/.aws/config"
        owner: "{{ login_user }}"
        group: "{{ login_user }}"
        mode: "0600"

    - name: Configure shell environment
      ansible.builtin.copy:
        content: |
          export AWS_REGION={{ aws_region }}
          export AWS_DEFAULT_REGION={{ aws_region }}
          alias k=kubectl
        dest: /etc/profile.d/devboard.sh
        mode: "0644"
