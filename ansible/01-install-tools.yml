---
- name: Install bastion tools
  hosts: devboard
  become: true
  vars:
    base_packages:
      - curl
      - wget
      - unzip
      - jq
      - dnsutils
      - git
      - vim
      - nano
      - ca-certificates
      - gnupg
      - software-properties-common

  tasks:
    - name: Install common base packages
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present
        update_cache: true

    - name: Install AWS CLI v2
      ansible.builtin.shell: |
        if ! command -v aws >/dev/null 2>&1; then
          cd /tmp
          curl -sS "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q -o awscliv2.zip
          ./aws/install
        fi
      args:
        executable: /bin/bash

    - name: Install Terraform
      ansible.builtin.shell: |
        if ! command -v terraform >/dev/null 2>&1; then
          apt-get update
          apt-get install -y gnupg software-properties-common
          wget -qO- https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main" > /etc/apt/sources.list.d/hashicorp.list
          apt-get update
          apt-get install -y terraform
        fi
      args:
        executable: /bin/bash

    - name: Install kubectl
      ansible.builtin.shell: |
        if ! command -v kubectl >/dev/null 2>&1; then
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          install -m 0755 kubectl /usr/local/bin/kubectl
          rm -f kubectl
        fi
      args:
        executable: /bin/bash

    - name: Install Helm
      ansible.builtin.shell: |
        if ! command -v helm >/dev/null 2>&1; then
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        fi
      args:
        executable: /bin/bash

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker.io
        state: present

    - name: Enable Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
